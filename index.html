<div id="intro-screen" class="screen active">
  <div class="intro-content">
    
    <!-- الخطوة 1 -->
    <div id="intro-step-1">
      <h1 class="fade-in">قبل ما نبدأ الرحلة...</h1>
      <p class="question-text">تحبيني لو لا؟ 💖</p>
      <div class="intro-buttons">
        <button id="love-yes-btn" class="main-btn">أي أحبك ✨</button>
        <button id="love-no-btn" class="secondary-btn">لا 😜</button>
      </div>
    </div>

    <!-- الخطوة 2 -->
    <div id="intro-step-2" class="hidden">
      <h1 class="fade-in">مُتأكدة؟ 😏</h1>
      <div class="intro-buttons">
        <button id="confirm-yes-btn" class="main-btn">أي متأكدة! 💖</button>
        <button id="confirm-no-btn" class="secondary-btn">لا مو متأكدة 🙈</button>
      </div>
    </div>

    <!-- الخطوة 3 -->
    <div id="intro-step-3" class="hidden">
      <h1 class="fade-in">قولي والله! 🤭</h1>
      <p class="sub-text">ها نسيت أنتِ ملحدة! 🙈 لعد قولي:</p>
      <div class="intro-buttons">
        <button id="swear-yes-btn" class="main-btn">والطبيعة أحبك 🌿💖</button>
        <button id="swear-no-btn" class="secondary-btn">ما أقول 😜</button>
      </div>
    </div>

    <!-- رسالة المحبة الختامية (جديد) -->
    <div id="intro-final-message" class="hidden">
      <h2 class="fade-in highlight-text">وآني هم هواي أحبج ومقتاقلج... 💖</h2>
      <p class="sweet-text">كافي لا تبتعدين أكثر 🥺✨</p>
      <div class="intro-buttons">
        <button id="start-game-btn" class="main-btn">تعالي نبدأ اللعبة ✨</button>
      </div>
    </div>

  </div>
</div>
