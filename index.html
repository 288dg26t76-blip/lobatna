<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لعبتنا ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#5a286f,#160b21 70%);color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(700px,100%);background:rgba(255,255,255,.09);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:28px 20px;box-shadow:0 20px 80px #0009;text-align:center}
.heart{font-size:58px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.small{opacity:.72;font-size:14px}
.title{font-size:30px;margin:8px 0 14px}
.text{font-size:19px;line-height:2;min-height:125px}
button{border:0;border-radius:18px;padding:13px 21px;margin:6px;font-size:17px;font-weight:700;cursor:pointer;background:#fff;color:#29112f}
button:active{transform:scale(.97)}
.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.progress{height:6px;background:#ffffff20;border-radius:99px;margin:20px 0 4px;overflow:hidden}
.bar{height:100%;width:0;background:#fff;border-radius:99px;transition:.45s}
.stage{font-size:13px;opacity:.65;margin-top:10px}
.choice{display:flex;flex-direction:column;align-items:stretch}
.choice button{width:100%;margin:5px 0}
.final{font-size:21px;line-height:2.1}
.bracelet{font-size:76px;margin:8px 0;filter:drop-shadow(0 5px 12px #0006)}
.name{font-weight:800}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div id="screen"></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="stage" id="stage"></div>
</main>

<script>
const stages=[
{
 title:"البداية",
 text:"عندي شي صغير أريد أوصله إلج... بس ما أريد أكوله بطريقة عادية. خلي نمشي سوا كم مرحلة ❤️",
 buttons:["نبدأ"]
},
{
 title:"المرحلة الأولى",
 text:"إذا الشخص اللي تحبينه صار بعيد عنج شوي بسبب انشغالاته... تحسين بالفرق؟",
 buttons:["إي أحس","أكيد","أحس بس أتفهم"]
},
{
 title:"المرحلة الثانية",
 text:"الانشغال مو هو اللي يوجعني... اللي يوجعني هو إحساس إني مرات أحتاج قربج وما ألقاج يمّي.",
 buttons:["أفهمج","كملي"]
},
{
 title:"المرحلة الثالثة",
 text:"ويمكن عتبي مو لأنج مشغولة... عتبي لأنج غالية عليّ، ولهذا غيابج يصير أكبر بعيوني من غياب أي شخص ثاني.",
 buttons:["أعرف","كملي"]
},
{
 title:"المرحلة الرابعة",
 text:"مرات أنتظر رسالة منج أو لحظة أحچي وياج وأظل أگول يمكن هسه تفضى... ويمكن هسه ترجعلي.",
 buttons:["🥺 كملي","أوعدج أكمل"]
},
{
 title:"المرحلة الخامسة",
 text:"وإذا شفتيني أعاتبج، لا تفسريه إنو أريد أضغط عليج... أني بس أريد أحس إن إلي مكان ثابت بقلبج حتى بأيام انشغالچ.",
 buttons:["إلچ مكان","كملي"]
},
{
 title:"المرحلة السادسة",
 text:"هسه وصلنا للشي اللي وعدتج بيه... شي يظل يذكرنا ببعض حتى لو الأيام شغلتنا.",
 buttons:["أريد أشوفه"]
},
{
 title:"المرحلة السابعة",
 text:"هذا السوار مو مجرد سوار... هذا وعدنا. وعد إن ما ننزعه من إيدنا، وكل ما نشوفه نتذكر إن أكو شخص ينتظرنا ويحبنا.",
 buttons:["وعد ❤️","أكمل"]
},
{
 title:"المرحلة الثامنة",
 text:"حتى لو صار يوم متعب... حتى لو انشغلنا... حتى لو صار بينا عتب، السوار يبقى يذكرنا إن اللي بينا أهم من لحظة زعل.",
 buttons:["وعد ما أنزعه","كملي"]
},
{
 title:"المرحلة الأخيرة",
 text:"بقى شي واحد بس... إذا وصلتي لهنا، اعرفي إن كل هالمراحل ما كانت لعبة وبس. كانت طريقة حتى أوصل لج شعوري.",
 buttons:["أريد النهاية ❤️"]
}
];

let i=0;
const screen=document.getElementById("screen");
const bar=document.getElementById("bar");
const stage=document.getElementById("stage");

function renderStart(){
screen.innerHTML=`
<div class="heart">♥</div>
<div class="small">لعبتنا</div>
<h1 class="title">إلج وحدج ❤️</h1>
<p class="text">لعبة صغيرة بيها شوية حب وشوية عتب ووعد ما ننساه.</p>
<button onclick="next()">نبدأ؟</button>`;
stage.textContent="";
bar.style.width="0%";
}
function next(){
if(i<stages.length){
const s=stages[i];
i++;
const isBracelet=i===7;
screen.innerHTML=`
${isBracelet?'<div class="bracelet">💍</div>':'<div class="heart">'+(i===stages.length?'♡':'♥')+'</div>'}
<div class="small">${s.title}</div>
<h1 class="title">خطوة ${i}</h1>
<p class="text">${s.text}</p>
<div class="choice">
${s.buttons.map((b,n)=>`<button ${n?'class="secondary"':''} onclick="next()">${b}</button>`).join("")}
</div>`;
bar.style.width=(i/stages.length*100)+"%";
stage.textContent=`${i} من ${stages.length}`;
}else{
screen.innerHTML=`
<div class="heart">♥</div>
<div class="small">النهاية</div>
<h1 class="title">وصلنا ❤️</h1>
<p class="final">
مو كل عتب يعني زعل<br>
ومو كل انتظار يعني ضغط<br>
ومو كل غياب يعني نسيان<br><br>
مرات الإنسان بس يريد يحس إن الشخص اللي يحبه بعده قريب منه<br>
وإن مكانه بقلبه ما تغير<br><br>
<span class="name">وأني أحبج وأريدج تبقين قريبة مني مهما شغلتنا الحياة</span><br><br>
والسوار؟<br>
<span class="name">وعدنا... ما ننزعه ❤️</span>
</p>
<button onclick="location.reload()">أعيد اللعبة</button>`;
bar.style.width="100%";
stage.textContent="اكتملت اللعبة ❤️";
}
}
renderStart();
</script>
</body>
</html>
